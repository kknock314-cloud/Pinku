<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <!-- V9 FIX: This meta tag bypasses strict Referrer-based CORS blocks used by many live streams -->
    <meta name="referrer" content="no-referrer">
    <title>Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background: #111111; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 15px;
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            box-sizing: border-box;
            overflow: hidden;
        }
        .header-title {
            color: #2ecc71;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .header-sub {
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            background: #222;
            border: 1px solid #333;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #2ecc71;
        }
        .btn-play {
            background: #2ecc71;
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex: 1; /* Takes available space */
            min-height: 200px;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            position: absolute;
            transition: all 0.3s ease;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .controls-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            flex-shrink: 0;
        }
        
        .btn-control {
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-control:active { background: #333; }
        .btn-control.active {
            border-color: #2ecc71;
            color: #2ecc71;
        }
        
        .btn-close {
            background: #3a1c1c;
            color: #ff4757;
            border: 1px solid #3a1c1c;
        }
        .btn-close:hover, .btn-close:active {
            border-color: #ff4757;
        }

        .footer-text {
            color: #888;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.5;
            flex-shrink: 0;
        }

        /* Landscape Mode Rotation Logic */
        .rotated-video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg) !important;
        }
        
        #playerUI {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        #inputUI {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="header-title">Stream Player</div>
    <div class="header-sub">Portrait · Landscape · PWA · No Ads</div>
    
    <div id="inputUI">
        <div class="input-row">
            <input type="text" id="linkInput" placeholder="YouTube / mp4 / m3u8 link...">
            <button class="btn-play" onclick="playVideo()">Play</button>
        </div>
    </div>

    <div id="playerUI">
        <div class="video-container" id="videoContainer">
            <!-- Video/Iframe goes here -->
        </div>

        <div class="controls-grid">
            <button class="btn-control active" id="btnPortrait" onclick="setPortrait()">📱 Portrait</button>
            <button class="btn-control" id="btnLandscape" onclick="setLandscape()">🖥️ Landscape</button>
            <button class="btn-control" id="btnPause" onclick="togglePlayPause()">⏯️ Pause</button>
            <button class="btn-control" onclick="togglePiP()">📺 PiP</button>
        </div>
        
        <div class="controls-grid-2">
            <button class="btn-control" onclick="toggleFullscreen()">🔳 Fullscreen</button>
            <button class="btn-control btn-close" onclick="closePlayer()">❌ Close</button>
        </div>

        <div class="footer-text">
            Landscape = video full screen (phone seedha). Controls neeche safe area me.
        </div>
    </div>

    <script>
        const linkInput = document.getElementById('linkInput');
        const videoContainer = document.getElementById('videoContainer');
        const inputUI = document.getElementById('inputUI');
        const playerUI = document.getElementById('playerUI');
        
        const btnPortrait = document.getElementById('btnPortrait');
        const btnLandscape = document.getElementById('btnLandscape');
        const btnPause = document.getElementById('btnPause');
        
        let currentMedia = null;
        let hlsInstance = null;

        function playVideo() {
            const link = linkInput.value.trim();
            if (!link) return alert("Please enter a link!");

            videoContainer.innerHTML = '';
            setPortrait(); // Reset rotation
            
            inputUI.style.display = 'none';
            playerUI.style.display = 'flex';

            if(link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = '';
                if(link.includes('youtu.be/')) videoId = link.split('youtu.be/')[1].split('?')[0];
                else if(link.includes('v=')) videoId = link.split('v=')[1].split('&')[0];

                if(videoId) {
                    currentMedia = document.createElement('iframe');
                    currentMedia.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    currentMedia.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
                    currentMedia.allowFullscreen = true;
                    videoContainer.appendChild(currentMedia);
                    return;
                }
            }

            currentMedia = document.createElement('video');
            currentMedia.controls = true;
            currentMedia.autoplay = true;
            currentMedia.playsInline = true;
            videoContainer.appendChild(currentMedia);

            // Play Pause listener
            currentMedia.addEventListener('play', () => btnPause.innerHTML = '⏸️ Pause');
            currentMedia.addEventListener('pause', () => btnPause.innerHTML = '▶️ Play');

            // HLS Setup
            if (link.includes('.m3u8') || link.includes('.m3u')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hlsInstance.loadSource(link);
                    hlsInstance.attachMedia(currentMedia);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => currentMedia.play().catch(e => console.log(e)));
                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            console.error("HLS Error:", data);
                        }
                    });
                } else if (currentMedia.canPlayType('application/vnd.apple.mpegurl')) {
                    currentMedia.src = link;
                    currentMedia.play().catch(e => console.log(e));
                } else {
                    alert("Your browser does not support HLS playback.");
                }
            } else {
                currentMedia.src = link;
                currentMedia.play().catch(e => console.log(e));
            }
        }

        function closePlayer() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if(currentMedia && currentMedia.tagName === 'VIDEO') {
                currentMedia.pause();
                currentMedia.src = "";
            }
            videoContainer.innerHTML = '';
            currentMedia = null;
            
            playerUI.style.display = 'none';
            inputUI.style.display = 'flex';
        }

        function setPortrait() {
            if(!currentMedia) return;
            btnPortrait.classList.add('active');
            btnLandscape.classList.remove('active');
            
            currentMedia.style.width = '100%';
            currentMedia.style.height = '100%';
            currentMedia.classList.remove('rotated-video');
        }

        function setLandscape() {
            if(!currentMedia) return;
            btnLandscape.classList.add('active');
            btnPortrait.classList.remove('active');
            
            const cWidth = videoContainer.clientWidth;
            const cHeight = videoContainer.clientHeight;
            
            currentMedia.style.width = cHeight + 'px';
            currentMedia.style.height = cWidth + 'px';
            currentMedia.classList.add('rotated-video');
        }

        function togglePlayPause() {
            if(!currentMedia || currentMedia.tagName !== 'VIDEO') return;
            if(currentMedia.paused) {
                currentMedia.play();
                btnPause.innerHTML = '⏸️ Pause';
            } else {
                currentMedia.pause();
                btnPause.innerHTML = '▶️ Play';
            }
        }

        function toggleFullscreen() {
            if (!currentMedia) return;
            if (!document.fullscreenElement) {
                if (currentMedia.requestFullscreen) currentMedia.requestFullscreen();
                else if (currentMedia.webkitRequestFullscreen) currentMedia.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        async function togglePiP() {
            if (!currentMedia || currentMedia.tagName !== 'VIDEO') {
                alert("PiP works for video files. For YouTube, press Fullscreen then swipe to home.");
                return;
            }
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (currentMedia.requestPictureInPicture) {
                        await currentMedia.requestPictureInPicture();
                    }
                }
            } catch (error) {
                console.error(error);
                alert("Play the video first to use PiP.");
            }
        }
    </script>
</body>
</html>
