<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Universal Web Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* CSS FIX: 100dvh use kiya hai taaki mobile me controls neeche na chhupe */
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: #111;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffcc;
            flex-shrink: 0;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }
        .player-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #050505;
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        video, iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        /* FIX: flex-shrink: 0 add kiya hai taaki controls hamesha dikhe */
        .controls { 
            padding: 12px; 
            background: #222; 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
            flex-shrink: 0; 
            z-index: 10;
        }
        .row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .input-wrapper {
            display: flex;
            flex: 1;
            position: relative;
        }
        input { 
            width: 100%;
            padding: 12px; 
            padding-right: 40px;
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #111;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        .clear-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }
        .clear-btn:hover { color: #ff4757; }
        button { 
            padding: 12px 10px; 
            cursor: pointer; 
            border-radius: 5px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold; 
            transition: 0.2s;
            font-size: 14px;
            text-align: center;
        }
        .btn-play { flex: 0.3; }
        button:hover { background: #0056b3; opacity: 0.8; }
        
        /* Action Buttons */
        .btn-pip { background: #ff4757; flex: 1; }
        .btn-rotate { background: #e1b12c; color: #000; flex: 1; }
        .btn-fs { background: #4cd137; color: #000; flex: 1; }

        .instructions {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        
        /* Rotation Class */
        .rotated-90 {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="header">Universal Ad-Free Player</div>
    
    <div class="main-content">
        <div class="player-container" id="playerContainer">
            <div class="instructions">
                <h2>Paste a link below to start.</h2>
                <p>Supports direct video links (.mp4) and YouTube links.</p>
            </div>
        </div>

        <div class="controls">
            <div class="row">
                <div class="input-wrapper">
                    <input type="text" id="linkInput" placeholder="Paste Video Link here...">
                    <button class="clear-btn" onclick="clearInput()">✖</button>
                </div>
                <button class="btn-play" onclick="playVideo()">Play</button>
            </div>
            <div class="row" id="actionButtons" style="display: none;">
                <button class="btn-rotate" onclick="rotateVideo()">🔄 Rotate 90°</button>
                <button class="btn-fs" onclick="toggleFullscreen()">🔲 Fullscreen</button>
                <button class="btn-pip" onclick="togglePiP()" id="pipBtn">📺 PiP</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        const container = document.getElementById('playerContainer');
        const actionButtons = document.getElementById('actionButtons');
        const linkInput = document.getElementById('linkInput');
        let currentVideoElement = null;
        let currentRotation = 0;

        function clearInput() {
            linkInput.value = '';
            linkInput.focus();
        }

        function playVideo() {
            const link = linkInput.value.trim();
            if (!link) {
                alert("Please paste a link first!");
                return;
            }

            container.innerHTML = ''; 
            currentRotation = 0; // Reset rotation
            actionButtons.style.display = 'flex';

            if(link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = '';
                if(link.includes('youtu.be/')) {
                    videoId = link.split('youtu.be/')[1].split('?')[0];
                } else if(link.includes('v=')) {
                    videoId = link.split('v=')[1].split('&')[0];
                }

                if(videoId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    iframe.allow = "autoplay; encrypted-media; picture-in-picture";
                    iframe.allowFullscreen = true;
                    container.appendChild(iframe);
                    document.getElementById('pipBtn').style.display = 'none';
                    currentVideoElement = iframe;
                    return;
                }
            }

            const video = document.createElement('video');
            video.src = link;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            currentVideoElement = video;
            container.appendChild(video);
            
            document.getElementById('pipBtn').style.display = 'block';
        }

        function rotateVideo() {
            if (!currentVideoElement) return;
            currentRotation += 90;
            if (currentRotation === 360) currentRotation = 0;
            
            // Scaling logic so the rotated video fills the portrait screen nicely
            if (currentRotation % 180 !== 0) {
                const ratio = container.clientHeight / container.clientWidth;
                currentVideoElement.style.transform = `rotate(${currentRotation}deg) scale(${ratio})`;
            } else {
                currentVideoElement.style.transform = `rotate(${currentRotation}deg) scale(1)`;
            }
        }

        function toggleFullscreen() {
            if (!currentVideoElement) return;
            const elem = container;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        async function togglePiP() {
            const videoElement = document.querySelector('video');
            if (!videoElement) {
                alert("PiP is only available for direct video links (.mp4).");
                return;
            }
            
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (videoElement.requestPictureInPicture) {
                        await videoElement.requestPictureInPicture();
                    } else {
                        alert("Aapka browser PiP support nahi karta.");
                    }
                }
            } catch (error) {
                console.error("PiP Error: ", error);
                alert("PiP failed. Play the video first.");
            }
        }
    </script>
</body>
</html>
