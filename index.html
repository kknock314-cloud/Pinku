<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Universal Web Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: #111;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffcc;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }
        .controls { 
            padding: 15px; 
            background: #222; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
            align-items: center;
        }
        .input-wrapper {
            display: flex;
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        input { 
            width: 100%;
            padding: 12px; 
            padding-right: 40px;
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #111;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        .clear-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }
        .clear-btn:hover { color: #ff4757; background: transparent; }
        button { 
            padding: 12px 20px; 
            cursor: pointer; 
            border-radius: 5px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold; 
            transition: 0.2s;
            font-size: 16px;
            flex: 1;
        }
        button:hover { background: #0056b3; }
        .pip-btn { background: #ff4757; display: none; }
        .pip-btn:hover { background: #ff6b81; }
        .player-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #050505;
            position: relative;
            width: 100%;
        }
        video, iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            max-height: 100%;
            object-fit: contain;
        }
        .instructions {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        /* LANDSCAPE MODE RESPONSIVENESS */
        @media (orientation: landscape) {
            .main-content {
                flex-direction: row-reverse;
            }
            .header {
                display: none; 
            }
            .controls {
                flex-direction: column;
                width: 300px;
                height: 100%;
                overflow-y: auto;
                border-left: 1px solid #333;
            }
            .input-wrapper {
                min-width: 100%;
            }
            button {
                width: 100%;
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">Universal Ad-Free Player</div>
    
    <div class="main-content">
        <div class="player-container" id="playerContainer">
            <div class="instructions">
                <h2>Paste a link below to start.</h2>
                <p>Supports direct video links (.mp4) and YouTube links.</p>
            </div>
        </div>

        <div class="controls">
            <div class="input-wrapper">
                <input type="text" id="linkInput" placeholder="Paste Video Link here...">
                <button class="clear-btn" onclick="clearInput()">✖</button>
            </div>
            <button onclick="playVideo()">Play Video</button>
            <button onclick="togglePiP()" id="pipBtn" class="pip-btn">📺 PiP Mode</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        const container = document.getElementById('playerContainer');
        const pipBtn = document.getElementById('pipBtn');
        const linkInput = document.getElementById('linkInput');
        let currentVideoElement = null;

        function clearInput() {
            linkInput.value = '';
            linkInput.focus();
        }

        function playVideo() {
            const link = linkInput.value.trim();
            if (!link) {
                alert("Please paste a link first!");
                return;
            }

            container.innerHTML = ''; 

            if(link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = '';
                if(link.includes('youtu.be/')) {
                    videoId = link.split('youtu.be/')[1].split('?')[0];
                } else if(link.includes('v=')) {
                    videoId = link.split('v=')[1].split('&')[0];
                }

                if(videoId) {
                    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
                    pipBtn.style.display = 'none';
                    currentVideoElement = null;
                    return;
                }
            }

            const video = document.createElement('video');
            video.src = link;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true; // CRITICAL for mobile PiP
            currentVideoElement = video;
            container.appendChild(video);
            
            pipBtn.style.display = 'block';
        }

        async function togglePiP() {
            if (!currentVideoElement) {
                alert("PiP is only available for direct video links (.mp4). YouTube blocks Web PiP.");
                return;
            }
            
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (currentVideoElement.requestPictureInPicture) {
                        await currentVideoElement.requestPictureInPicture();
                    } else {
                        alert("Aapka browser PiP mode support nahi karta.");
                    }
                }
            } catch (error) {
                console.error("PiP Error: ", error);
                alert("PiP failed: Check if video is playing.");
            }
        }
    </script>
</body>
</html>
