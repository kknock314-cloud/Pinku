<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Universal Web Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        .header {
            text-align: center;
            padding: 10px;
            background: #111;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffcc;
        }
        .controls { 
            padding: 15px; 
            background: #222; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
        }
        input { 
            flex: 1; 
            min-width: 200px;
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #111;
            color: white;
        }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 5px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { background: #0056b3; }
        .pip-btn { background: #ff4757; display: none; }
        .pip-btn:hover { background: #ff6b81; }
        .player-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #050505;
        }
        video, iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            max-height: 100%;
        }
        .instructions {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">Universal Ad-Free Player</div>
    
    <div class="controls">
        <input type="text" id="linkInput" placeholder="Paste Video Link (.mp4, .m3u8, YouTube) here...">
        <button onclick="playVideo()">Play Video</button>
        <button onclick="togglePiP()" id="pipBtn" class="pip-btn">📺 PiP Mode</button>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="instructions">
            <h2>Paste a link above to start watching.</h2>
            <p>Supports direct video links (.mp4) and YouTube links.</p>
        </div>
    </div>

    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Registered!'))
                .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }

        const container = document.getElementById('playerContainer');
        const pipBtn = document.getElementById('pipBtn');
        let currentVideoElement = null;

        function playVideo() {
            const link = document.getElementById('linkInput').value.trim();
            if (!link) {
                alert("Please paste a link first!");
                return;
            }

            container.innerHTML = ''; 

            if(link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = '';
                if(link.includes('youtu.be/')) {
                    videoId = link.split('youtu.be/')[1].split('?')[0];
                } else if(link.includes('v=')) {
                    videoId = link.split('v=')[1].split('&')[0];
                }

                if(videoId) {
                    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
                    pipBtn.style.display = 'none';
                    currentVideoElement = null;
                    return;
                }
            }

            const video = document.createElement('video');
            video.src = link;
            video.controls = true;
            video.autoplay = true;
            currentVideoElement = video;
            container.appendChild(video);
            
            pipBtn.style.display = 'block';
        }

        async function togglePiP() {
            if (!currentVideoElement) return;
            
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (currentVideoElement.requestPictureInPicture) {
                        await currentVideoElement.requestPictureInPicture();
                    } else {
                        alert("Aapka browser PiP mode support nahi karta.");
                    }
                }
            } catch (error) {
                console.error("PiP Error: ", error);
            }
        }
    </script>
</body>
</html>
