<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Universal Web Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: #111;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffcc;
            flex-shrink: 0;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }
        .player-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #050505;
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        video, iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            position: relative;
        }
        
        .rotated-video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg) !important;
        }

        .controls { 
            padding: 12px; 
            background: #222; 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
            flex-shrink: 0; 
            z-index: 10;
        }
        .row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .input-wrapper {
            display: flex;
            flex: 1;
            position: relative;
        }
        input { 
            width: 100%;
            padding: 12px; 
            padding-right: 40px;
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #111;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        .clear-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }
        .clear-btn:hover { color: #ff4757; }
        button { 
            padding: 12px 10px; 
            cursor: pointer; 
            border-radius: 5px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold; 
            transition: 0.2s;
            font-size: 14px;
            text-align: center;
        }
        .btn-play { flex: 0.3; }
        .btn-back { background: #fc5c65; color: white; width: 100%; display: none; }
        .btn-back:hover { background: #eb3b5a; }
        button:hover { background: #0056b3; opacity: 0.8; }
        
        .btn-pip { background: #1e3799; flex: 1; }
        .btn-rotate { background: #f6b93b; color: #000; flex: 1; }
        .btn-fs { background: #78e08f; color: #000; flex: 1; }

        .instructions {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">Universal Ad-Free Player</div>
    
    <div class="main-content">
        <div class="player-container" id="playerContainer">
            <div class="instructions">
                <h2>Paste a link below to start.</h2>
                <p>Supports direct video links (.mp4, .m3u8, .live) and YouTube links.</p>
            </div>
        </div>

        <div class="controls">
            <!-- UI Layout -->
            <button class="btn-back" id="backBtn" onclick="goBack()">🔙 Back to Home</button>
            <div class="row" id="inputRow">
                <div class="input-wrapper" id="inputWrapper">
                    <input type="text" id="linkInput" placeholder="Paste Video/Live Link here...">
                    <button class="clear-btn" onclick="clearInput()">✖</button>
                </div>
                <button class="btn-play" id="playBtn" onclick="playVideo()">Play</button>
            </div>
            
            <div class="row" id="actionButtons" style="display: none;">
                <button class="btn-rotate" id="rotateBtn" onclick="rotateVideo()">🔄 Rotate 90°</button>
                <button class="btn-fs" onclick="toggleFullscreen()">🔲 Fullscreen</button>
                <button class="btn-pip" onclick="togglePiP()" id="pipBtn">📺 PiP</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('playerContainer');
        const actionButtons = document.getElementById('actionButtons');
        const linkInput = document.getElementById('linkInput');
        const inputRow = document.getElementById('inputRow');
        const backBtn = document.getElementById('backBtn');
        let currentVideoElement = null;
        let hlsInstance = null;
        
        let isRotated = false;

        function clearInput() {
            linkInput.value = '';
            linkInput.focus();
        }

        function goBack() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            container.innerHTML = `
                <div class="instructions">
                    <h2>Paste a link below to start.</h2>
                    <p>Supports direct video links (.mp4, .m3u8, .live) and YouTube links.</p>
                </div>
            `;
            currentVideoElement = null;
            isRotated = false;

            inputRow.style.display = 'flex';
            backBtn.style.display = 'none';
            actionButtons.style.display = 'none';
        }

        function playVideo() {
            const link = linkInput.value.trim();
            if (!link) {
                alert("Please paste a link first!");
                return;
            }

            container.innerHTML = ''; 
            
            isRotated = false;
            const rotateBtn = document.getElementById('rotateBtn');
            rotateBtn.innerHTML = '🔄 Rotate 90°';
            rotateBtn.style.background = '#f6b93b';
            
            inputRow.style.display = 'none';
            backBtn.style.display = 'block';
            actionButtons.style.display = 'flex';

            if(link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = '';
                if(link.includes('youtu.be/')) {
                    videoId = link.split('youtu.be/')[1].split('?')[0];
                } else if(link.includes('v=')) {
                    videoId = link.split('v=')[1].split('&')[0];
                }

                if(videoId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
                    iframe.allowFullscreen = true;
                    container.appendChild(iframe);
                    document.getElementById('pipBtn').style.display = 'none';
                    currentVideoElement = iframe;
                    return;
                }
            }

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            currentVideoElement = video;
            container.appendChild(video);
            
            document.getElementById('pipBtn').style.display = 'block';

            // V12 FIX: Added .live to the live stream condition explicitly
            if (link.includes('.m3u8') || link.includes('.m3u') || link.includes('.live')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({ debug: false });
                    hlsInstance.loadSource(link);
                    hlsInstance.attachMedia(video);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log(e));
                    });
                    
                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            console.warn("HLS.js failed. Falling back to Native Player...");
                            hlsInstance.destroy();
                            hlsInstance = null;
                            video.src = link;
                            video.play().catch(e => console.log("Native fallback error:", e));
                        }
                    });
                } else {
                    video.src = link;
                    video.play().catch(e => console.log(e));
                }
            } else {
                video.src = link;
                video.play().catch(e => console.log(e));
            }
        }

        function rotateVideo() {
            if (!currentVideoElement) return;
            
            isRotated = !isRotated; 
            const rotateBtn = document.getElementById('rotateBtn');

            if (isRotated) {
                const cWidth = container.clientWidth;
                const cHeight = container.clientHeight;
                
                currentVideoElement.style.width = cHeight + 'px';
                currentVideoElement.style.height = cWidth + 'px';
                
                currentVideoElement.classList.add('rotated-video');
                
                rotateBtn.innerHTML = '🔄 Rotate 0°';
                rotateBtn.style.background = '#e17055'; 
            } else {
                currentVideoElement.style.width = '100%';
                currentVideoElement.style.height = '100%';
                currentVideoElement.classList.remove('rotated-video');
                
                rotateBtn.innerHTML = '🔄 Rotate 90°';
                rotateBtn.style.background = '#f6b93b'; 
            }
        }

        function toggleFullscreen() {
            if (!currentVideoElement) return;
            
            const elem = currentVideoElement; 
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        async function togglePiP() {
            const videoElement = document.querySelector('video');
            if (!videoElement) {
                alert("PiP is only available for direct video links. For YouTube, click 'Fullscreen' and then swipe to Home!");
                return;
            }
            
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (videoElement.requestPictureInPicture) {
                        await videoElement.requestPictureInPicture();
                    } else {
                        alert("Aapka browser PiP support nahi karta.");
                    }
                }
            } catch (error) {
                console.error("PiP Error: ", error);
                alert("PiP failed. Play the video first.");
            }
        }
    </script>
</body>
</html>
